name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: command -v ffprobe || brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Install CPU test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Source checks
        run: |
          python -m compileall -q .
          node --check web/app.js
      - name: Test portable runtime, exports and HTTP
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Publication hygiene
        run: python scripts/check_publication.py
